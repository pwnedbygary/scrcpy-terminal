name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Run on any branch from the Actions tab or: gh workflow run build.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          # No go.sum: the module has no dependencies outside the standard library.
          cache-dependency-path: go.mod

      - name: Install build deps (ffmpeg libs, pulseaudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o scterm .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: scterm-linux-x86_64
          path: scterm

  android:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      # Not v6: it moved caching into a proprietary component under Gradle's
      # separate Terms of Use; v5 already runs on Node 24, under the MIT license.
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, debug APK, dev tools
        run: >-
          ./gradlew --no-daemon
          :protocol:test :peer:test :app:testDebugUnitTest
          :app:lintDebug :app:assembleDebug :peerctl:assemble

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: scterm-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Tags build the signed release APK; manual runs do too, to check the
      # signing without releasing. The key comes from repository secrets.
      - name: Signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          SCTERM_KEYSTORE_BASE64: ${{ secrets.SCTERM_KEYSTORE_BASE64 }}
          SCTERM_KEYSTORE_PASSWORD: ${{ secrets.SCTERM_KEYSTORE_PASSWORD }}
        run: |
          export SCTERM_KEYSTORE="$RUNNER_TEMP/scterm-release.p12"
          printf %s "$SCTERM_KEYSTORE_BASE64" | base64 --decode > "$SCTERM_KEYSTORE"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease "-Pscterm.version=$VERSION"
          else
            VERSION=dev
            ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease
          fi
          rm -f "$SCTERM_KEYSTORE"
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | grep 'certificate SHA-256'
          mv "$APK" "app/build/outputs/apk/release/scterm-android-$VERSION.apk"

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: scterm-android-release
          path: android/app/build/outputs/apk/release/scterm-android-*.apk
          if-no-files-found: error

  release:
    # Manual runs rehearse this job without publishing.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build, android]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.mod

      - name: Install build deps (ffmpeg libs, pulseaudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev

      - name: Build release binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION=dev
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o scterm .

      - name: Signed Android APK
        uses: actions/download-artifact@v8
        with:
          name: scterm-android-release

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "scterm ${{ github.ref_name }}"
          body: |
            ${{ github.event.head_commit.message }}
          files: |
            scterm
            scterm-android-*.apk
