name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install build deps (ffmpeg libs, pulseaudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o scterm .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: scterm-linux-x86_64
          path: scterm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install build deps (ffmpeg libs, pulseaudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev

      - name: Build release binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o scterm .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "scterm ${{ github.ref_name }}"
          body: |
            ${{ github.event.head_commit.message }}
          files: scterm
