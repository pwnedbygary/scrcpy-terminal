name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Run on any branch from the Actions tab or: gh workflow run build.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install build deps (ffmpeg libs, pulseaudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o scterm .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: scterm-linux-x86_64
          path: scterm

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK, dev tools
        run: >-
          ./gradlew --no-daemon
          :protocol:test :peer:test :app:testDebugUnitTest
          :app:lintDebug :app:assembleDebug :peerctl:assemble

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scterm-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install build deps (ffmpeg libs, pulseaudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev

      - name: Build release binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o scterm .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "scterm ${{ github.ref_name }}"
          body: |
            ${{ github.event.head_commit.message }}
          files: scterm
